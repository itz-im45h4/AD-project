# Service identity and public HTTP port. Each service has a different port so Swagger/Postman can address it independently.
spring.profiles.active=local
spring.application.name=account-service
server.port=8081

# Atlas URI must target only account_db. The fallback is for local development; credentials always stay outside Git.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/account_db}
app.security.jwt-secret=${JWT_SECRET:}
